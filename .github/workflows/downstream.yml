name: Downstream

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  downstream:
    # A library whose consumers nobody builds will break them again. This job is the
    # only thing standing between a breaking change and a product that finds out
    # months later. The list grows by one entry as each product phase lands.
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - gridlock-server
          - kybookmarks-server
          - kypassword-server
    runs-on: ubuntu-latest
    steps:
      - name: Check out ky-primitives
        uses: actions/checkout@v4
        with:
          path: ky-primitives
          # The Build and Test steps below run the consumer's own test code from this
          # shared workspace. Persisting credentials would leave this job's GITHUB_TOKEN
          # in an http.extraheader in ky-primitives/.git/config for that code to read.
          # Nothing later in this job runs git against the remote.
          persist-credentials: false

      - name: Check out ${{ matrix.consumer }}
        # A breaking change cannot be fixed in one commit across two repositories.
        # Prefer a consumer branch named like this PR's head branch so a coordinated
        # change can be tested as a pair; otherwise use the consumer's default branch.
        # ls-remote --exit-code returns 2 for "ref not found" and something else for
        # a transient failure (auth, network, DNS, rate limit) that must not be read
        # as absence -- that would silently test the wrong branch and go green.
        env:
          GH_TOKEN: ${{ secrets.SUITE_READ_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Two of the three consumers are public and pair correctly over anonymous read,
          # so an unset token is not fatal. Say why the private one is about to fail with
          # an authentication error rather than leaving the operator to infer it.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::SUITE_READ_TOKEN is not configured; public consumers will still pair, private ones will fail to authenticate below"
          fi
          repo="https://x-access-token:${GH_TOKEN}@github.com/Busness-app/${{ matrix.consumer }}.git"
          branch=""
          if [ -n "${HEAD_REF}" ]; then
            set +e
            git ls-remote --exit-code --heads "${repo}" "${HEAD_REF}" >/dev/null
            status=$?
            set -e
            if [ "${status}" -eq 0 ]; then
              branch="${HEAD_REF}"
            elif [ "${status}" -ne 2 ]; then
              echo "ls-remote against ${{ matrix.consumer }} exited ${status}, not a clean absence (2); refusing to fall back to the default branch" >&2
              exit "${status}"
            fi
          fi
          if [ -n "${branch}" ]; then
            echo "Pairing with ${{ matrix.consumer }} branch ${branch}"
            git clone --depth 1 --branch "${branch}" "${repo}" "${{ matrix.consumer }}"
          else
            echo "Using ${{ matrix.consumer }} default branch"
            git clone --depth 1 "${repo}" "${{ matrix.consumer }}"
          fi
          # The clone URL embeds the token and git wrote it into .git/config. The next
          # steps run this consumer's own build/test code from this directory, so drop
          # git history and the token together rather than trying to scrub just one.
          rm -rf "${{ matrix.consumer }}/.git"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Point the consumer at this checkout
        working-directory: ${{ matrix.consumer }}
        run: go mod edit -replace github.com/Busness-app/ky-primitives=../ky-primitives

      - name: Build
        working-directory: ${{ matrix.consumer }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.consumer }}
        run: go test -count=1 ./...
